<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Detail Event | Aksatix</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--g:#00FF96;--gd:#00CC78;--gt:#008F55;--ink:#16211D;--muted:#5E6F68;--line:#E2EBE7;--soft:#F5F9F7;box-sizing:border-box}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:14px/1.6 'Plus Jakarta Sans',system-ui,sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:1120px;margin:auto;padding:0 24px}header{border-bottom:1px solid var(--line);padding:14px 0;background:white}.nav{display:flex;align-items:center;justify-content:space-between;gap:18px}.logo{font-weight:800;font-size:28px;letter-spacing:-1px;display:flex;align-items:center}.logo img{height:42px;width:auto}.navlinks{display:flex;gap:10px;align-items:center}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:12px 18px;font-weight:800;background:var(--g);color:var(--ink)}.btn.outline{background:#fff;border:1px solid var(--line)}.crumb{margin:24px 0;color:var(--muted);font-size:13px}.panel{border:1px solid var(--line);border-radius:22px;padding:24px;background:#fff}.grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:24px}.poster{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:16px;background:var(--soft)}.tag{display:inline-flex;border-radius:99px;background:#E0FFF1;color:var(--gt);font-size:12px;font-weight:800;padding:6px 10px}.muted{color:var(--muted)}h1{font-size:clamp(28px,4vw,42px);line-height:1.12;letter-spacing:-1.5px;margin:12px 0}h2{font-size:22px;letter-spacing:-.5px;margin:0 0 14px}.meta{display:grid;gap:10px;margin:18px 0}.ticket{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0}.ticket input{accent-color:var(--gd)}.ticket small{display:block;color:var(--muted);margin-top:4px}.price{font-weight:800;font-size:18px}.field{display:grid;gap:6px;margin:14px 0}.field input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px}.paygrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pay{border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:800}.pay small{display:block;color:var(--muted);font-weight:500}.pay.active{border-color:var(--gd);background:#F0FFF8}.pay.disabled{opacity:.55}.notice{background:#F0FFF8;border-radius:12px;padding:12px;margin:12px 0;color:#285A45}.error{background:#FFF0EF;color:#B42318;padding:12px;border-radius:10px;margin:12px 0;display:none}.full{width:100%}footer{margin-top:54px;padding:24px 0;border-top:1px solid var(--line);color:var(--muted)}@media(max-width:760px){.wrap{padding:0 16px}.grid{grid-template-columns:1fr}.panel{padding:18px}.navlinks .hide-mobile{display:none}.logo img{height:36px}.paygrid{grid-template-columns:1fr 1fr}}
</style></head><body><header><div class="wrap nav"><a class="logo" href="index.html"><img src="assets/logo.png" alt="Aksatix"></a><nav class="navlinks"><a class="btn outline hide-mobile" href="index.html">Jelajahi event</a><a class="btn" href="login.html?next=checkout.html">Masuk / Daftar</a></nav></div></header><main class="wrap"><div class="crumb"><a href="index.html">Beranda</a> / <span>Detail event</span></div><div id="loading" class="panel">Memuat informasi event…</div><div id="err" class="error"></div><div id="event" hidden></div></main><footer><div class="wrap">© Aksatix · Temukan pengalaman berikutnya.</div></footer><script src="./supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=n=>Number(n)===0?'Gratis':new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0), date=s=>s?new Date(s+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}):'Tanggal menyusul';
const sb=window.supabase.createClient(window.AKSATIX_SUPABASE_URL,window.AKSATIX_SUPABASE_ANON_KEY);const id=new URLSearchParams(location.search).get('id');let eventData,tickets=[];
async function init(){try{if(!id)throw Error('ID event tidak ditemukan. Kembali ke beranda dan pilih event.');const [{data:er,error:ee},{data:tr,error:te}]=await Promise.all([sb.from('aksatix_records').select('record_id,payload').eq('kind','events'),sb.from('aksatix_records').select('record_id,payload').eq('kind','tickets')]);if(ee)throw ee;if(te)throw te;eventData=(er||[]).map(r=>r.payload||{}).find(e=>String(e.id)===String(id)||String(e.record_id)===String(id));if(!eventData)throw Error('Event tidak ditemukan atau sudah dihapus.');tickets=(tr||[]).map(r=>r.payload||{}).filter(t=>String(t.eventId??t.event_id)===String(eventData.id)&&(t.status||'Active').toLowerCase()==='active');if(!tickets.length)tickets=[{id:'default-'+eventData.id,eventId:eventData.id,name:'Tiket',price:Number(eventData.price??eventData.p??0),quota:0,status:'Active'}];render();}catch(e){$('loading').hidden=true;$('err').style.display='block';$('err').textContent=e.message||'Gagal memuat event. Coba lagi.'}}
function render(){const e=eventData,prices=tickets.map(t=>Number(t.price)||0),start=Math.min(...prices);document.title=(e.name||e.title||'Detail Event')+' | Aksatix';$('loading').hidden=true;$('event').hidden=false;$('event').innerHTML=`<div class="grid"><section><img class="poster" src="${esc(e.image||'assets/logo.png')}" alt="Poster ${esc(e.name||e.title)}"><div style="margin:22px 0"><span class="tag">${esc(e.category||'Event')}</span><h1>${esc(e.name||e.title||'Event')}</h1><div class="meta muted"><div>▦ &nbsp;${esc(date(e.date||e.d))}${e.time||e.startTime?' · '+esc(e.time||e.startTime):''}</div><div>⌖ &nbsp;${esc(e.location||e.venue||e.place||e.address||e.city||'Lokasi menyusul')}</div><div>♧ &nbsp;${esc(e.organizer||e.organizer_name||'Penyelenggara Aksatix')}</div></div><h2>Tentang acara</h2><p style="white-space:pre-line">${esc(e.description||e.desc||e.details||'Informasi acara akan diperbarui oleh penyelenggara.')}</p></div></section><aside class="panel"><span class="muted">Harga tiket mulai dari</span><div class="price" style="font-size:28px;margin:4px 0 18px">${money(start)}</div><h2>Pilih tiket</h2><div id="ticketList">${tickets.map((t,i)=>`<label class="ticket"><span><b>${esc(t.name||t.ticketName||t.type||'Tiket')}</b><small>${Number(t.quota??t.quantity??t.stock)>0?'Kuota tersedia: '+Number(t.quota??t.quantity??t.stock):esc(t.description||'Tiket event')}</small></span><span style="text-align:right"><b>${money(t.price)}</b><input type="radio" name="ticket" value="${esc(t.id||t.ticketId||t.ticket_id)}" ${i===0?'checked':''}></span></label>`).join('')}</div><label class="field"><b>Jumlah tiket</b><input id="qty" type="number" min="1" max="10" value="1"></label><div class="notice" id="total"></div><button class="btn full" id="buy">Beli tiket sekarang</button><p class="muted" style="font-size:12px">Tiket gratis tidak memerlukan pembayaran. Tiket berbayar sementara menggunakan QRIS.</p></aside></div>`;const update=()=>{const t=chosen();$('total').textContent='Total: '+money((Number(t.price)||0)*Math.max(1,Math.min(10,Number($('qty').value)||1)))};function chosen(){return tickets.find(t=>String(t.id||t.ticketId||t.ticket_id)===String(document.querySelector('input[name="ticket"]:checked')?.value))||tickets[0]}document.querySelectorAll('input[name="ticket"]').forEach(x=>x.addEventListener('change',update));$('qty').addEventListener('input',update);update();$('buy').onclick=()=>{const t=chosen(),q=Math.max(1,Math.min(10,Number($('qty').value)||1));try{sessionStorage.setItem('aksatix_pending_cart',JSON.stringify([{id:eventData.id,ticketId:t.id||t.ticketId||t.ticket_id,ticketName:t.name||t.ticketName||'Tiket',price:Number(t.price)||0,q,eventName:eventData.name||eventData.title||'Event'}]));sessionStorage.setItem('aksatix_after_login_checkout','1')}catch(_){}location.href='checkout.html'};}
init();</script></body></html>
