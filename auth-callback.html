<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Menghubungkan akun | Aksatix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --g: #00FF96; --gd: #00CC78; --gt: #008F55; --ink: #16211D; --muted: #5E6F68; --line: #E2EBE7; --soft: #F5F9F7; box-sizing: border-box; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: var(--ink); font: 14px/1.6 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }
    .panel { border: 1px solid var(--line); border-radius: 22px; padding: 32px; background: #fff; text-align: center; max-width: 400px; width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    .muted { color: var(--muted); margin-top: 8px; }
    h1 { font-size: 24px; letter-spacing: -0.5px; margin: 16px 0 0; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Login berhasil</h1>
    <p class="muted">Menghubungkan akun dan membuka halaman berikutnya…</p>
  </main>

  <script src="./supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Inisialisasi dengan implicit flow agar otomatis menangkap token dari hash URL (#access_token=...)
    const sb = window.supabase.createClient(
      window.AKSATIX_SUPABASE_URL,
      window.AKSATIX_SUPABASE_ANON_KEY,
      {
        auth: {
          flowType: 'implicit',
          detectSessionInUrl: true,
          persistSession: true
        }
      }
    );

    (async () => {
      try {
        // Berikan sedikit jeda agar Supabase JS client sempat membaca token dari URL hash
        setTimeout(async () => {
          const { data: { session }, error } = await sb.auth.getSession();
          
          if (error) throw error;

          if (session) {
            const next = sessionStorage.getItem('aksatix_auth_next') || '/';
            sessionStorage.removeItem('aksatix_auth_next');
            
            const pending = sessionStorage.getItem('aksatix_after_login_checkout') === '1';
            location.replace(pending ? '/checkout.html' : next);
          } else {
            document.querySelector('.muted').textContent = 'Menunggu sesi masuk... silakan coba lagi.';
          }
        }, 500);

      } catch (e) {
        document.querySelector('h1').textContent = 'Gagal Masuk';
        document.querySelector('.muted').textContent = 'Error: ' + e.message;
      }
    })();
  </script>
</body>
</html>
